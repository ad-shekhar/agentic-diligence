version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic_diligence_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agentic_diligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agentic_diligence_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
